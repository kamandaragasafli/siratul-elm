<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş — Sirac</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --ink: #1a2233;
      --muted: #8b95a8;
      --line: #e8ecf2;
      --blue: #4b8bf5;
      --danger: #e85d5d;
      --shadow: 0 16px 48px rgba(30, 45, 80, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e8f9d8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 28px;
      padding: 36px 32px 28px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .mark {
      width: 48px; height: 48px; border-radius: 16px;
      background: linear-gradient(145deg, var(--blue), #6aa8ff);
      color: #fff; font-weight: 800; font-size: 20px;
      display: grid; place-items: center;
      box-shadow: 0 10px 22px rgba(75, 139, 245, 0.35);
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #f7f9fc;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
    }
    .field input:focus {
      outline: none;
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(75, 139, 245, 0.15);
    }
    .error {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fdeaea;
      color: #b53a3a;
      font-size: 14px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 14px 18px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(75, 139, 245, 0.32);
    }
    .btn:hover { filter: brightness(1.05); }
    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">S</div>
      <div>
        <h1>Sirac</h1>
        <p>İdarə paneli</p>
      </div>
    </div>

    <h2>Giriş</h2>
    <p class="lead">Staff hesabınızla daxil olun.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'panel-login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="field">
        <label for="username">İstifadəçi adı</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus value="{{ username }}" />
      </div>
      <div class="field">
        <label for="password">Şifrə</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit">Daxil ol</button>
    </form>

    <p class="foot">Sirac panel · yalnız səlahiyyətli istifadəçilər</p>
  </div>
</body>
</html>
